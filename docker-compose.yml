services:
    db:
        image: postgres:18-alpine
        container_name: quotes-backend-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: loco
            POSTGRES_PASSWORD: loco
            POSTGRES_DB: quotes_backend_development
        ports:
            - "5432:5432"
        volumes:
            - quotes-backend-pgdata:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U loco -d quotes_backend_development"]
            interval: 2s
            timeout: 3s
            retries: 30

volumes:
    quotes-backend-pgdata:
