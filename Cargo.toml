[workspace]

[package]
name = "quotes-backend"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "quotes_backend-cli"

[workspace.dependencies]
loco-rs = { version = "1.2", default-features = false, features = ["cli", "with-db", "cache_inmem"] }

[dependencies]
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.45", default-features = false, features = ["rt-multi-thread"] }
axum = "0.8"
migration = { path = "migration" }
sea-orm = { version = "2.0", default-features = false, features = ["macros", "with-chrono", "with-uuid"]}
validator = { version = "0.20" }
chrono = "0.4"
serde_trim = "1.1.0"

[[bin]]
name = "quotes_backend-cli"
path = "src/bin/main.rs"
required-features = []
[[bin]]
name = "tool"
path = "src/bin/tool.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
serde_json = { version = "1" }
